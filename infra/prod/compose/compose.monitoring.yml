# 모니터링 6종 — Prometheus · Loki · Promtail · Grafana · exporter 2종
#
# compose.yml 과 분리한 이유: 메모리가 부족할 때 모니터링만 내릴 수 있어야 한다.
#   docker compose -f compose.yml -f compose.monitoring.yml up -d
#
# 전부 expose 만 쓴다. 호스트에 게시되는 포트는 여전히 Caddy 의 80·443 뿐이고,
# Grafana 를 보려면 SSM 포트 포워딩으로 터널을 뚫는다.
#
# 설계 근거: monitoring.md · containers.md §3.1
name: twojo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    expose:
      - "9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 기본값이 무제한이다. 명시하지 않으면 디스크가 조용히 찬다.
      - --storage.tsdb.retention.time=7d
      # deploy.sh 가 SIGHUP 으로 설정을 다시 읽게 한다
      - --web.enable-lifecycle
    mem_limit: 384m
    logging: *default-logging
    networks: [twojo-net]

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    expose:
      - "3100"
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    mem_limit: 256m
    logging: *default-logging
    networks: [twojo-net]

  promtail:
    image: grafana/promtail:3.4.2
    restart: unless-stopped
    volumes:
      - ../monitoring/promtail/promtail.yml:/etc/promtail/config.yml:ro
      # 도커가 남기는 컨테이너 로그 원본. 읽기 전용으로만 붙인다.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-positions:/tmp
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    mem_limit: 96m
    logging: *default-logging
    networks: [twojo-net]

  grafana:
    image: grafana/grafana:11.6.1
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # 알람 연락 지점이 이 값을 참조한다. .env 에서 오고 저장소에는 없다.
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:?DISCORD_WEBHOOK_URL 이 .env 에 없다}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 가 .env 에 없다}
      # 공개망에 열리지 않지만, 터널 뒤라고 가입을 열어둘 이유는 없다.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    # Grafana 가 알람 엔진이다. 내리면 관측만 되고 알림이 사라진다 —
    # containers.md §11.1 의 "Grafana 상시 기동 안 함" 선택지가 이래서 철회됐다.
    mem_limit: 256m
    logging: *default-logging
    networks: [twojo-net]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    expose:
      - "9187"
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USERNAME:?}:${DB_PASSWORD:?}@postgres:5432/${DB_NAME:-twojo}?sslmode=disable
    depends_on:
      - postgres
    mem_limit: 64m
    logging: *default-logging
    networks: [twojo-net]

  node-exporter:
    image: prom/node-exporter:v1.9.0
    restart: unless-stopped
    expose:
      - "9100"
    # 호스트의 커널·파일시스템 지표를 봐야 하므로 호스트 네임스페이스가 필요하다.
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker)($$|/)
    mem_limit: 32m
    logging: *default-logging
    networks: [twojo-net]

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  promtail-positions:
