# Prometheus · Loki 데이터소스.
# uid 를 고정한다 — 알람 규칙(alerting/rules.yml)이 이 값을 참조한다.
# 자동 생성 uid 를 쓰면 재생성 때마다 규칙이 깨진다.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 30s
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
