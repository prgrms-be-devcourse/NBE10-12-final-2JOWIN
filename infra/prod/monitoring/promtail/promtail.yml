# 도커가 남기는 컨테이너 로그 파일을 읽어 Loki 로 보낸다.
#
# 라벨은 container · level · env 셋만 둔다. Loki 는 라벨 조합마다 스트림을
# 만들기 때문에, traceId·userId 같은 값을 라벨에 넣으면 스트림이 무한히 늘어
# 256m 로는 못 버틴다. 그런 값은 로그 본문에 두고 LogQL 로 검색한다.
#
# 설계 근거: monitoring.md §6

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          env: prod
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      # 1. 도커 json-file 드라이버 포장을 벗긴다
      - json:
          expressions:
            output: log
            stream: stream
            time: time

      # 2. 컨테이너 이름을 파일 경로에서 뽑아 라벨로 쓴다
      - regex:
          source: filename
          expression: '/var/lib/docker/containers/(?P<container_id>[^/]+)/.*'
      - labels:
          container_id:

      # 3. 애플리케이션 로그가 JSON 이면 level 만 라벨로 올린다.
      #    JSON 이 아니면(Caddy 이외 컨테이너) 이 스테이지는 조용히 지나간다.
      - json:
          expressions:
            level: level
          source: output
      - labels:
          level:

      # 4. 마스킹 — 앱이 이미 가리지만 수집 단계에서 한 번 더 막는다.
      #    로그에 비밀·토큰을 남기지 않는 규칙은 양쪽에서 지킨다 (docs/14 §2-6).
      - replace:
          expression: '(?i)(password"?\s*[:=]\s*"?)([^",}\s]+)'
          source: output
          replace: '${1}***'
      - replace:
          expression: '(?i)((?:refresh_?token|access_?token|token)"?\s*[:=]\s*"?)([^",}\s]+)'
          source: output
          replace: '${1}***'
      - replace:
          expression: '(?i)(authorization"?\s*[:=]\s*"?)(bearer\s+)?([^",}\s]+)'
          source: output
          replace: '${1}***'
      # 이메일 로컬파트 — a***@example.com
      - replace:
          expression: '([A-Za-z0-9._%+-])[A-Za-z0-9._%+-]*(@[A-Za-z0-9.-]+)'
          source: output
          replace: '${1}***${2}'

      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: output
