<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2JO — 화면 설계 v1</title>
<style>
:root{
  --chrome:#2C2C2C; --chrome2:#383838; --chrome3:#444444; --line:#454545;
  --txt:#E8E8E8; --sub:#9C9C9C; --sel:#0D99FF; --pin:#7B61FF; --pin-hot:#5A3BFF;
  --canvas:#F0F0F3; --frame-line:#E3E4E9; --ink:#2F3238; --ink-sub:#8A8F98;
  --warn-bg:#FFF6DC; --warn-line:#F0DEA6; --warn-txt:#8A6A00;
  --info-bg:#F0F2F6; --info-txt:#5A616E;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,Pretendard,'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--chrome);color:var(--txt);font-size:13px;-webkit-font-smoothing:antialiased}

/* ── 상단 바 ─────────────────────────── */
.topbar{display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;background:var(--chrome);border-bottom:1px solid var(--line)}
.logo{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#0D99FF,#7B61FF);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#fff;flex:0 0 auto}
.fname{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fname small{color:var(--sub);font-weight:400;margin-left:6px}
.tabs{margin-left:auto;display:flex;background:var(--chrome2);border-radius:8px;padding:3px;flex:0 0 auto}
.tabs button{border:0;background:transparent;color:var(--sub);font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer;font-family:inherit}
.tabs button.on{background:#555;color:#fff}

/* ── 레이아웃 ─────────────────────────── */
.layout{display:grid;grid-template-columns:216px 1fr 264px;height:calc(100% - 46px)}
.panel{background:var(--chrome);overflow-y:auto}
.panel::-webkit-scrollbar,.main::-webkit-scrollbar{width:8px;height:8px}
.panel::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb{background:#555;border-radius:4px}
#nav{border-right:1px solid var(--line);padding:10px 8px}
.ng{margin-bottom:12px}
.ng h4{font-size:10px;color:var(--sub);font-weight:600;letter-spacing:.6px;padding:4px 8px;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;font-size:12px;color:#CFCFCF;cursor:pointer;user-select:none}
.ni:hover{background:var(--chrome2)}
.ni.on{background:rgba(13,153,255,.18);color:#fff}
.ni .fi{width:12px;height:12px;border:1.3px solid #8b8b8b;border-radius:2px;flex:0 0 auto}
.ni.on .fi{border-color:var(--sel)}
.ni .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main{background:var(--canvas);background-image:radial-gradient(#D9DBE1 1px,transparent 1px);background-size:16px 16px;overflow:auto;position:relative;padding:22px}
.framecap{font-size:11px;color:#7C818B;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.framecap b{color:#4B5058;font-weight:600}
.zoom{margin-left:auto;font-size:10.5px;color:#9AA0AA;background:#fff;border:1px solid var(--frame-line);border-radius:5px;padding:2px 7px}
#stage{position:relative}
#insp{border-left:1px solid var(--line);padding:12px 10px}
#insp h3{font-size:11px;font-weight:600;color:var(--sub);letter-spacing:.5px;text-transform:uppercase;padding:0 6px 8px}
#insp .cnt{color:#777}
.ri{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;border-radius:6px;font-size:11.5px;color:#D6D6D6;line-height:1.35;cursor:default}
.ri:hover{background:var(--chrome2)}
.ri .rid{flex:0 0 auto;font-size:9px;font-weight:700;background:var(--pin);color:#fff;border-radius:4px;padding:2px 5px;margin-top:1px}
.ri.gq .rid{background:#B58A00}
.idiv{border-top:1px solid var(--line);margin:10px 6px}

/* ── 프레임(와이어프레임 공통) ───────── */
.frame{background:#fff;border:1px solid var(--frame-line);border-radius:10px;box-shadow:0 8px 28px rgba(40,44,60,.10);color:var(--ink);transform-origin:top left;overflow:hidden}
.frame,.frame *{font-size:11px;line-height:1.45}
.frame .h1{font-size:14px;font-weight:700}
.frame .h2{font-size:12px;font-weight:700}
.shell{display:flex;align-items:center;gap:14px;padding:9px 14px;border-bottom:1px solid #ECEDF1;background:#FBFBFD;color:#5A616E}
.shell .dot{width:16px;height:16px;border-radius:4px;background:linear-gradient(135deg,#0D99FF,#7B61FF);flex:0 0 auto}
.shell b{color:var(--ink)}
.shell .sp{margin-left:auto;display:flex;gap:10px;align-items:center}
.ava{width:18px;height:18px;border-radius:50%;background:#DADDE4}
.bell{width:16px;height:16px;border-radius:50%;border:1.4px solid #B9BEC8}
.sec{padding:12px 14px}
.sec + .sec{border-top:1px solid #F0F1F4}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.sp{margin-left:auto}
.b{background:#F4F5F8;border:1px dashed #C9CDD6;border-radius:6px;min-height:30px}
.inp{border:1px solid #D7DAE1;border-radius:6px;padding:6px 9px;color:#9AA0AA;background:#fff;min-width:0}
.inp.w{flex:1}
.btn{border:1px solid #D7DAE1;border-radius:6px;padding:5px 10px;color:#3E434C;background:#fff;white-space:nowrap}
.btn.p{background:var(--sel);border-color:var(--sel);color:#fff}
.btn.d{color:#C4453B;border-color:#E9C6C2}
.chk{width:11px;height:11px;border:1.4px solid #B9BEC8;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:5px}
.tog{width:26px;height:14px;border-radius:8px;background:#0D99FF;position:relative;display:inline-block;vertical-align:middle}
.tog:after{content:"";position:absolute;right:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#fff}
.tog.off{background:#C9CDD6}.tog.off:after{right:auto;left:2px}
.tag{display:inline-block;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:600;background:#EEF0F4;color:#5A616E}
.tag.blue{background:#E3F1FF;color:#0B72C0}.tag.green{background:#E2F6E9;color:#177A3D}
.tag.red{background:#FBE9E7;color:#B4372E}.tag.gray{background:#EEF0F4;color:#777}
.tag.amber{background:#FFF3D2;color:#8A6A00}
.tbl{border:1px solid #E9EAEE;border-radius:8px;overflow:hidden}
.tr{display:flex;gap:10px;align-items:center;padding:7px 10px;border-top:1px solid #F0F1F4}
.tr:first-child{border-top:0}
.tr.th{background:#F8F9FB;color:#7C818B;font-weight:600;font-size:10px}
.tr>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font-size:10.5px;color:var(--warn-txt);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;padding:5px 8px}
.info{font-size:10.5px;color:var(--info-txt);background:var(--info-bg);border:1px solid #E2E5EB;border-radius:6px;padding:5px 8px}
.rq{display:inline-block;font-style:normal;font-size:8.5px;font-weight:700;background:var(--pin);color:#fff;border-radius:4px;padding:1px 5px;vertical-align:1px;margin:0 1px;letter-spacing:.2px;transition:transform .12s}
.rq.hot{background:var(--pin-hot);transform:scale(1.28);box-shadow:0 0 0 3px rgba(123,97,255,.25)}
.rq.nw{background:#1B9E55}
.ri.gp .rid{background:#1B9E55}
.qq{display:inline-block;font-size:8.5px;font-weight:700;background:#B58A00;color:#fff;border-radius:4px;padding:1px 5px;vertical-align:1px}
.card{background:#fff;border:1px solid #E5E7EC;border-radius:7px;padding:7px 9px;margin-top:6px;box-shadow:0 1px 2px rgba(30,34,50,.05)}
.kan{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.kc{background:#F6F7FA;border-radius:8px;padding:8px;min-height:120px}
.kc h5{font-size:10px;color:#5A616E;display:flex;gap:6px;align-items:center}
.kc h5 em{font-style:normal;color:#9AA0AA;font-weight:400;margin-left:auto}
.bar{height:9px;border-radius:4px;background:linear-gradient(90deg,#0D99FF,#7B61FF)}
.stat{border:1px solid #E9EAEE;border-radius:8px;padding:9px 11px;flex:1;min-width:110px}
.stat b{font-size:15px}
.stat small{color:#8A8F98;display:block}
.step{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.step i{font-style:normal;border:1px solid #D7DAE1;border-radius:20px;padding:2px 9px;font-size:10px;color:#7C818B;background:#fff}
.step i.on{background:var(--sel);border-color:var(--sel);color:#fff}
.step em{color:#C4C8D0;font-style:normal}
.mail{background:#F8F9FB;border:1px solid #E5E7EC;border-radius:8px;padding:9px 11px}
.mail .mh{font-size:10px;color:#8A8F98;margin-bottom:4px}
.lock{display:inline-block;font-size:9px;font-weight:700;color:#8A6A00;background:#FFF3D2;border-radius:4px;padding:2px 6px}

/* ── 매핑 뷰 ─────────────────────────── */
#map{max-width:960px}
.mpanel{background:#fff;border:1px solid var(--frame-line);border-radius:10px;box-shadow:0 8px 28px rgba(40,44,60,.10);color:var(--ink);overflow:hidden;margin-bottom:16px}
.mhead{padding:14px 16px;border-bottom:1px solid #F0F1F4;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.mhead .h1{font-size:14px;font-weight:700}
.mstat{font-size:11px;color:#5A616E;background:#F4F5F8;border-radius:6px;padding:4px 10px}
.mstat b{color:#177A3D}
.msec>h4{font-size:11px;font-weight:700;color:#4B5058;background:#F8F9FB;padding:7px 16px;border-top:1px solid #F0F1F4}
.mr{display:grid;grid-template-columns:66px 1fr;gap:8px;align-items:start;padding:6px 16px;border-top:1px solid #F5F6F8;font-size:11px}
.mr:hover{background:#FAFBFD}
.mr .rid{font-size:9px;font-weight:700;background:var(--pin);color:#fff;border-radius:4px;padding:2px 0;text-align:center;margin-top:1px}
.mr.def .rid{background:#B4B8C2}
.mr .lab{color:#2F3238}
.mr .lab small{color:#9AA0AA;margin-left:2px}
.scrn{display:inline-block;font-size:10px;color:#0B72C0;background:#E3F1FF;border-radius:5px;padding:1px 7px;margin:2px 3px 0 0;cursor:pointer}
.scrn:hover{background:#CFE7FF}
.gpol{display:inline-block;font-size:10px;color:#5A616E;background:#EEF0F4;border-radius:5px;padding:1px 7px;margin-top:2px}
.dnote{font-size:10px;color:#9AA0AA;margin-top:2px}

/* ── 반응형 ─────────────────────────── */
@media (max-width:920px){
  .layout{display:flex;flex-direction:column;height:auto}
  body{overflow:auto}
  #nav{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;padding:8px;gap:2px;white-space:nowrap}
  .ng{margin:0;display:flex;align-items:center}
  .ng h4{padding:4px 6px 4px 10px;border-left:1px solid var(--line);margin-left:6px}
  .ng:first-child h4{border-left:0;margin-left:0}
  .ni{flex:0 0 auto}
  .main{min-height:420px;padding:14px}
  #insp{border-left:0;border-top:1px solid var(--line)}
  .fname small{display:none}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">2J</div>
  <div class="fname">2JO · 화면 설계 v1<small>요구사항 정의서 v1 (2026-08-21) 기준</small></div>
  <div class="tabs">
    <button id="tabD" class="on">화면 설계</button>
    <button id="tabM">요구사항 매핑</button>
  </div>
</div>

<div class="layout">
  <div id="nav" class="panel"></div>
  <div id="mainD" class="main">
    <div class="framecap"><b id="capName"></b><span id="capDesc"></span><span class="zoom" id="zoom">100%</span></div>
    <div id="stage"></div>
  </div>
  <div id="mainM" class="main" style="display:none"><div id="map"></div></div>
  <div id="insp" class="panel">
    <h3>매핑된 요구사항 <span class="cnt" id="riCnt"></span></h3>
    <div id="riList"></div>
  </div>
</div>

<script>
/* ───────── 요구사항 라벨 ───────── */
const RL={
"ON-01":"회사 정보로 사용 신청","ON-02":"접수 확인","ON-03":"신청 목록 조회","ON-04":"신청 승인","ON-05":"신청 반려","ON-06":"승인·반려 결과 통보","ON-07":"승인 시 신청자 → 기업 관리자","ON-08":"회사 정지","ON-09":"정지 회사 구성원 이용 차단","ON-10":"정지 해제","ON-11":"영업 데이터 조회 불가","ON-12":"회사 목록·이용 현황","ON-13":"승인 전 이용 불가","ON-14":"반려 사유 기록",
"MB-01":"이메일로 직원 초대","MB-02":"초대 시 역할 지정","MB-03":"초대로 계정 생성","MB-04":"초대 만료","MB-05":"초대 취소","MB-06":"초대 재발송","MB-07":"구성원 목록","MB-08":"역할 변경","MB-09":"구성원 비활성화","MB-10":"비활성 구성원 이용 차단","MB-11":"최소 기업 관리자 1명 유지","MB-12":"담당 Deal 이관","MB-13":"타사 소속 이메일 초대 불가",

"PR-01":"상품 등록","PR-02":"이름·단가·단위·설명","PR-03":"상품 목록 조회","PR-04":"상품 수정","PR-05":"판매 중지","PR-06":"중지 상품 새 견적 추가 불가","PR-07":"중지가 기존 견적에 무영향","PR-08":"단가 변경이 기존 견적에 무영향","PR-09":"영업 담당자 편집 불가","PR-10":"카탈로그 전사 공유",
"QT-01":"Deal에 대한 견적 작성","QT-02":"카탈로그에서 항목 추가","QT-03":"직접 입력 항목","QT-04":"수량 조정","QT-05":"단가 조정","QT-06":"항목 삭제","QT-07":"항목 순서 변경","QT-08":"공급가액 자동 계산","QT-09":"유효기간 지정","QT-10":"안내 문구·조건","QT-11":"작성 중 저장·이어쓰기","QT-12":"발송 전 미리보기","QT-13":"견적 발송","QT-14":"작성 중 상태에서만 발송","QT-15":"빈 견적 발송 불가","QT-16":"발송 후 수정 불가","QT-17":"발송 회수","QT-18":"Deal당 여러 견적","QT-19":"견적 복제","QT-20":"견적 목록·상태 조회","QT-22":"부가세 자동 계산","QT-23":"부가세 별도/포함 지정","QT-24":"작성 시점 카탈로그 단가 기록","QT-25":"공급가액·부가세·합계 구분 표시",

"OD-01":"승인 견적 → 주문 전환","OD-02":"미승인 견적 전환 불가","OD-03":"견적당 주문 1건","OD-04":"전환 시점 내용·금액 스냅샷","OD-05":"이후 견적 변경 무영향","OD-06":"주문 생성 시 Deal 성사","OD-07":"주문 번호 부여","OD-08":"주문 목록","OD-09":"주문 상세","OD-10":"착수일·납기 기록",

/* ───────── 네비게이션 ───────── */
const nav=document.getElementById('nav');
let groups=[...new Set(SCREENS.map(s=>s.g))];
groups.forEach(g=>{
  const d=document.createElement('div');d.className='ng';
  d.innerHTML=`<h4>${g}</h4>`+SCREENS.filter(s=>s.g===g).map(s=>`<div class="ni" data-s="${s.id}"><span class="fi"></span><span class="n">${s.name}</span></div>`).join('');
  nav.appendChild(d);
});
nav.addEventListener('click',e=>{const n=e.target.closest('.ni');if(n){showTab('D');select(n.dataset.s);}});

/* ───────── 화면 선택 · 스케일 ───────── */
const stage=document.getElementById('stage'),capName=document.getElementById('capName'),capDesc=document.getElementById('capDesc'),zoomEl=document.getElementById('zoom');
const riList=document.getElementById('riList'),riCnt=document.getElementById('riCnt');
let cur=null;
function select(id){
  cur=SCREENS.find(s=>s.id===id);
  document.querySelectorAll('.ni').forEach(n=>n.classList.toggle('on',n.dataset.s===id));
  capName.textContent=cur.name;capDesc.textContent=cur.desc;
  stage.innerHTML=`<div class="frame" style="width:${cur.w}px">${cur.html}</div>`;
  riCnt.textContent=`(${cur.reqs.length})`;
  riList.innerHTML=cur.reqs.map(r=>`<div class="ri" data-r="${r}"><span class="rid">${r}</span><span>${RL[r]||''}</span></div>`).join('')
    +(cur.p?`<div class="idiv"></div>`+cur.p.map(q=>`<div class="ri gp"><span class="rid">제안</span><span>${q}</span></div>`).join(''):'')
    +(cur.q?`<div class="idiv"></div>`+cur.q.map(q=>`<div class="ri gq"><span class="rid">미결</span><span>${q}</span></div>`).join(''):'');
  fit();
}
function fit(){
  const fr=stage.querySelector('.frame');if(!fr)return;
  fr.style.transform='none';
  const avail=stage.parentElement.clientWidth-2;
  const s=Math.min(1,avail/fr.offsetWidth);
  fr.style.transform=`scale(${s})`;
  stage.style.height=(fr.offsetHeight*s)+'px';
  zoomEl.textContent=Math.round(s*100)+'%';
}
window.addEventListener('resize',()=>{if(document.getElementById('mainD').style.display!=='none')fit();});

/* 인스펙터 hover ↔ 캔버스 핀 하이라이트 */
riList.addEventListener('mouseover',e=>{const i=e.target.closest('.ri');if(i&&i.dataset.r)stage.querySelectorAll(`[data-r="${i.dataset.r}"]`).forEach(p=>p.classList.add('hot'));});
riList.addEventListener('mouseout',e=>{const i=e.target.closest('.ri');if(i&&i.dataset.r)stage.querySelectorAll(`[data-r="${i.dataset.r}"]`).forEach(p=>p.classList.remove('hot'));});

/* ───────── 매핑 뷰 ───────── */
const R2S={};
SCREENS.forEach(s=>s.reqs.forEach(r=>{(R2S[r]=R2S[r]||[]).push(s);}));
function buildMap(){
  const ids=Object.keys(RL);
  const covered=ids.filter(r=>R2S[r]||GLOBAL[r]).length;
  let h=`<div class="mpanel"><div class="mhead"><span class="h1">요구사항 → 화면 매핑</span>
    <span class="mstat">v1 요구사항 ${ids.length}건 · 반영 <b>${covered}건 (${Math.round(covered/ids.length*100)}%)</b></span>
    <span class="mstat">다음 버전 보류 ${DEFERRED.length}건</span></div>`;
  MODULES.forEach(([p,name])=>{
    const rows=ids.filter(r=>r.startsWith(p+"-"));if(!rows.length)return;
    h+=`<div class="msec"><h4>${name} — ${p}</h4>`;
    rows.forEach(r=>{
      let dst=R2S[r]?R2S[r].map(s=>`<span class="scrn" data-s="${s.id}">${s.name}</span>`).join(''):
        `<span class="gpol">전역 정책</span><div class="dnote">${GLOBAL[r]||''}</div>`;
      h+=`<div class="mr"><span class="rid">${r}</span><span class="lab">${RL[r]}<br>${dst}</span></div>`;
    });
    h+=`</div>`;
  });
  h+=`</div><div class="mpanel"><div class="mhead"><span class="h1">다음 버전 보류 — 화면에 넣지 않음</span></div><div class="msec">`;
  DEFERRED.forEach(([r,l,q])=>{h+=`<div class="mr def"><span class="rid">${r}</span><span class="lab">${l}<small>· ${q} 결정에 따라 보류 — 번호는 유지</small></span></div>`;});
  h+=`</div></div>`;
  h+=`<div class="mpanel"><div class="mhead"><span class="h1">제안 — 문서에 없는 파생 요구사항</span><span class="mstat">AP-15(승인 전 문의)가 성립하려면 구성원 측 확인·답변 흐름 필요 → 정의서 추가 검토</span></div><div class="msec">`;
  PROPOSED.forEach(([r,l,ss])=>{h+=`<div class="mr"><span class="rid" style="background:#1B9E55">${r}</span><span class="lab">${l}<br>${ss.map(id=>{const s=SCREENS.find(x=>x.id===id);return `<span class="scrn" data-s="${id}">${s.name}</span>`;}).join('')}</span></div>`;});
  h+=`</div></div>`;
  const m=document.getElementById('map');m.innerHTML=h;
  m.querySelectorAll('.scrn').forEach(c=>c.addEventListener('click',()=>{showTab('D');select(c.dataset.s);}));
}

/* ───────── 탭 ───────── */
const tD=document.getElementById('tabD'),tM=document.getElementById('tabM');
function showTab(t){
  const d=t==='D';
  tD.classList.toggle('on',d);tM.classList.toggle('on',!d);
  document.getElementById('mainD').style.display=d?'':'none';
  document.getElementById('mainM').style.display=d?'none':'';
  document.getElementById('insp').style.display=d?'':'none';
  if(d)fit();
}
tD.onclick=()=>showTab('D');
tM.onclick=()=>{buildMap();showTab('M');};

select('S01');
</script>
</body>
