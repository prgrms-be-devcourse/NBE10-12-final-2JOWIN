# 공통 설정 — 프로필별 오버라이드는 application-{profile}.yml
spring:
  application:
    name: twojo-backend

  jpa:
    hibernate:
      ddl-auto: validate      # 스키마 정본은 Flyway — ddl-auto 기준 금지 (13-dev-workflow.md §3)
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC            # 저장·전송은 UTC(TIMESTAMPTZ·Instant), 표시 변환은 프론트 책임

# JWT — HS256 단일 키 (14 §3-4). 저장소에 시크릿을 두지 않는다 (14 §2-8).
# 기본값 없음 — 미주입 시 기동이 실패한다. local·test 프로필만 개발용 기본값을 갖는다.
jwt:
  secret: ${JWT_SECRET}

# 쿠키 — 07 refresh 쿠키 규약표. 이름·Path·SameSite는 코드 상수(RefreshCookieFactory)다.
# secure만 환경에 따라 갈린다. 기본값 true — 빠뜨렸을 때 안전한 쪽이 켜진 상태여야 한다.
app:
  cookie:
    secure: ${COOKIE_SECURE:true}
  # 재설정 메일에 실릴 링크의 앞부분. 뒤에 "?token=원문"이 붙는다.
  # 프론트 /password-reset 라우트가 토큰을 쿼리로 받는다.
  # 기본값 없음 — 빠뜨리면 엉뚱한 링크가 조용히 나가느니 기동이 실패하는 편이 낫다.
  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL}
  # 초대 메일에 실릴 링크의 앞부분. 뒤에 "/원문토큰"이 붙는다.
  # 프론트 /invite/:token 라우트가 토큰을 경로로 받는다.
  # 기본값 없음 — 재설정 링크와 같다. 빠뜨리면 엉뚱한 링크가 조용히 나가느니 기동이 실패하는 편이 낫다.
  invitation:
    base-url: ${INVITATION_BASE_URL}
  # CORS — 허용 오리진 정확 명시, 와일드카드 금지 (07 §A · 14 §3-9).
  # 기본값 없음 — jwt.secret과 같다. 운영에서 빠뜨리면 기동이 실패하는 편이 조용히 열리는 것보다 낫다.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  # 안내 메일 열람 링크가 가리키는 프론트 오리진 (/q/:token — 12-frontend-plan.md).
  # 기본값 없음 — cors와 같다. local·test만 개발용 리터럴을 갖는다.
  view-link:
    base-url: ${VIEW_LINK_BASE_URL}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus   # 14-tech-stack.md §1.5
  endpoint:
    health:
      probes:
        enabled: true
  # Boot 4 부터 지표 내보내기가 옵트인이다. 이 줄이 없으면
  # management.defaults.metrics.export.enabled 가 false 로 평가되어
  # PrometheusMeterRegistry 빈이 아예 만들어지지 않고,
  # exposure 에 prometheus 를 적어도 /actuator/prometheus 는 404 다 (#221).
  prometheus:
    metrics:
      export:
        enabled: true
  # 모든 지표에 application 라벨을 붙인다. 커뮤니티 대시보드(JVM 4701 등)가
  # 이 라벨로 앱을 고르므로, 없으면 패널이 전부 빈 화면으로 뜬다.
  #
  # 값이 하나뿐이라 시계열이 늘지 않는다 — job 라벨과 같은 성격이다
  # (monitoring.md §3.5 카디널리티).
  metrics:
    tags:
      application: ${spring.application.name}

# NT-05 무응답 리마인드 · NT-06 유효기간 임박 배치 (docs/03 §2.13 · docs/14 §1.2 단일 인스턴스 스케줄러)
notification:
  remind:
    cron: "0 0 9 * * *"       # 매일 09:00 (zone 기준)
    zone: "Asia/Seoul"        # cron 해석 시간대
    after-days: 3             # 발송 후 이 일수(경과 시간, 24h 단위)가 지나도록 무응답이면 리마인드 (sentAt 기준)
  expiring:
    cron: "-"                 # 비활성 — QuoteQuery.findExpiringBetween 실구현은 #315로 머지됐지만,
                              # 통합 테스트(실 PG)로 구간 경계·전 회사 반환·Q-27을 확인하기 전까지는 켜지 않는다.
                              # NT-06 후속 PR에서 "0 0 9 * * *"로 켠다.
    zone: "Asia/Seoul"        # cron 해석 시간대 · "오늘" 날짜 계산 시간대
    before-days: 3            # valid_until이 오늘 ~ 이 일수 뒤 구간에 들면 임박 (KST 날짜 기준)

# 견적 기간 만료 배치 (Q-37 — 배치 소유는 C · 전이표 §6)
# 리마인드(09:00)보다 앞선다 — 오늘 만료된 견적에 "응답이 없습니다" 리마인드가 나가면 틀린 안내다.
quote:
  expiry:
    cron: "0 30 8 * * *"      # 매일 08:30 (zone 기준)
    zone: "Asia/Seoul"        # cron 해석 시간대 — 만료 경계가 한국 날짜다 (Q-17)

---
# 로컬 개발 — infra/dev/docker-compose.yml의 PostgreSQL 사용
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5433/twojo
    username: twojo
    password: twojo
  flyway:
    locations: classpath:db/migration, classpath:db/seed   # local만 데모 시드 적용 (R__demo_seed.sql)

logging:
  level:
    org.hibernate.SQL: debug

# clone 직후 바로 bootRun 되도록 개발용 기본값을 둔다 — 운영 키로 쓰지 않는다
jwt:
  secret: ${JWT_SECRET:2jo-local-dev-only-secret-key-not-for-production-use}

# http://localhost 에서 Secure 쿠키는 브라우저가 저장하지 않을 수 있다 — Swagger 검증이 막힌다
app:
  cookie:
    secure: false
  # Vite 개발 서버가 이 경로를 띄운다
  password-reset:
    base-url: http://localhost:5173/password-reset
  invitation:
    base-url: http://localhost:5173/invite
  # Vite 개발 서버 기본 포트 — 도메인 확보 전까지는 로컬만 쓴다 (14 §1.4 자리표시자)
  cors:
    allowed-origins: http://localhost:5173
  view-link:
    base-url: http://localhost:5173

---
# 운영 — 값은 전부 환경변수 주입 (시크릿 저장 금지, 14-tech-stack.md §2-8)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
