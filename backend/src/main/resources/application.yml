# 공통 설정 — 프로필별 오버라이드는 application-{profile}.yml
spring:
  application:
    name: twojo-backend

  jpa:
    hibernate:
      ddl-auto: validate      # 스키마 정본은 Flyway — ddl-auto 기준 금지 (13-dev-workflow.md §3)
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC            # 저장·전송은 UTC(TIMESTAMPTZ·Instant), 표시 변환은 프론트 책임

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus   # 14-tech-stack.md §1.5
  endpoint:
    health:
      probes:
        enabled: true

---
# 로컬 개발 — infra/docker-compose.yml의 PostgreSQL 사용
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5433/twojo
    username: twojo
    password: twojo

logging:
  level:
    org.hibernate.SQL: debug

---
# 운영 — 값은 전부 환경변수 주입 (시크릿 저장 금지, 14-tech-stack.md §2-8)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
