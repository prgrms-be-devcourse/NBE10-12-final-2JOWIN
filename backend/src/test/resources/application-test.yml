# 테스트 프로필 — 실제 PostgreSQL 사용 (ddl-auto 기준 금지, 13-dev-workflow.md §3)
# 로컬: infra/docker-compose.yml이 twojo_test DB를 함께 만든다
# CI: 같은 좌표(localhost:5432/twojo_test)로 서비스 컨테이너를 띄운다
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/twojo_test
    username: twojo
    password: twojo

# BackendApplicationTests가 전체 컨텍스트를 로드하므로 JwtProvider 빈도 생성된다 — 키가 없으면 깨진다
jwt:
  secret: 2jo-test-only-secret-key-not-for-production-use

app:
  cookie:
    secure: false
  # 전체 컨텍스트 로드 시 PasswordService 생성자가 이 값을 요구한다 — 없으면 주입이 실패한다
  password-reset:
    base-url: http://localhost:5173/password-reset
  # 전체 컨텍스트 로드 시 CorsConfigurationSource 빈이 이 값을 요구한다 — 없으면 주입이 실패한다
  cors:
    allowed-origins: http://localhost:5173
  # ViewTokenCommandImpl이 @Value로 요구한다 — 없으면 contextLoads가 깨진다
  view-link:
    base-url: http://localhost:5173
