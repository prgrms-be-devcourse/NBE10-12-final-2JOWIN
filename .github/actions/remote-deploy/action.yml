# 원격 배포 — 배포하는 동안만 22번을 열고 SSH 로 deploy.sh 를 실행한다.
#
# backend-cd.yml(이미지 교체)과 infra-cd.yml(설정 전용)이 같은 일을 한다.
# 보안그룹을 여닫는 로직을 두 벌 두면 한쪽만 고치는 사고가 난다.
#
# 설계 근거: cd.md §4 · §9
name: 원격 배포
description: 배포 중에만 22번을 러너 IP /32 로 열고, deploy.sh 를 실행한 뒤 규칙을 회수한다

inputs:
  aws-region:
    description: 리전
    required: true
  security-group-name:
    description: 22번을 임시로 열 보안그룹 이름
    required: true
  project:
    description: Project 태그 값. 공유 계정이라 이름만으로는 대상을 특정할 수 없다
    default: '2jo'
  host:
    description: 접속 대상 (도메인 또는 EIP)
    required: true
  user:
    description: SSH 사용자
    default: ec2-user
  ssh-private-key:
    description: 배포용 개인키
    required: true
  known-hosts:
    description: 대상 호스트의 공개키. TOFU 를 쓰지 않으려고 지문을 고정한다
    required: true
  env-file:
    description: 서버 .env 에 그대로 쓸 내용. 비우면 전송하지 않는다
    default: ''
  image:
    description: 배포할 이미지 참조. 비우면 설정 전용 모드
    default: ''
  app-dir:
    description: 서버의 앱 디렉터리
    default: /opt/2jo
  tolerate-missing-host:
    description: 서버가 아직 없을 때 실패로 보지 않는다 (최초 apply 직후)
    default: 'false'

outputs:
  rc:
    description: deploy.sh 의 종료 코드. 0 성공 · 1 롤백대상없음 · 2 롤백됨 · 3 롤백실패 · 75 배포중
    value: ${{ steps.run.outputs.rc }}
  log:
    description: 서버가 내놓은 출력을 담은 파일 경로. 호출 쪽이 요약에 쓴다 (#260)
    value: ${{ steps.run.outputs.log }}

runs:
  using: composite
  steps:
    # ── 22번 개방 ────────────────────────────────────────────────────────
    # 상시 열지 않는 이유는 노출 시간이다. 상시 개방이면 100%, 이 방식이면
    # 배포 중 몇 분이다. 대가는 배포 역할에 붙는 보안그룹 수정 권한인데,
    # 그걸 훔칠 수 있는 주체는 같은 파이프라인의 SSH 개인키도 이미 가지고
    # 있다 — 이미 들어올 수 있는 쪽에 문을 열 권한을 주는 건 추가 손해가 아니다.
    - id: open
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws-region }}
        SG_NAME: ${{ inputs.security-group-name }}
        PROJECT: ${{ inputs.project }}
      run: |
        set -euo pipefail

        # 이 계정은 여러 팀이 공유한다. 이름만으로 찾으면 다른 팀이 우연히
        # 같은 이름을 써도 [0] 이 그걸 집는다. Project 태그로 함께 좁힌다 —
        # 배포 역할의 IAM 조건도 같은 태그를 본다.
        sg="$(aws ec2 describe-security-groups \
          --filters "Name=group-name,Values=${SG_NAME}" "Name=tag:Project,Values=${PROJECT}" \
          --region "$AWS_REGION" \
          --query 'SecurityGroups[].GroupId' --output text)"
        if [ "$(printf '%s' "$sg" | wc -w)" -gt 1 ]; then
          echo "::error::보안그룹이 여러 개 잡혔다: ${sg}"
          exit 1
        fi
        if [ -z "$sg" ] || [ "$sg" = "None" ]; then
          echo "::error::보안그룹 ${SG_NAME} 를 찾지 못했다"
          exit 1
        fi
        echo "security_group=${sg}" >> "$GITHUB_OUTPUT"

        # 잔류 규칙 정리 — 두 번째 그물이다. 아래 회수 스텝(if: always())이
        # 첫 번째고, 러너가 강제 종료됐을 때를 위한 보험이 이것이다.
        #
        # 설명이 같다고 지우면 안 된다. Backend CD 와 Infra CD 는 concurrency
        # 그룹이 달라 동시에 돌 수 있고, 둘 다 같은 설명으로 22번을 연다.
        # 살아 있는 규칙을 뺏으면 그쪽 SSH 가 배포 도중에 끊긴다 (#262).
        #
        # 그래서 설명에 여는 시각을 함께 넣고, 충분히 오래된 것만 지운다.
        # 규칙 태그를 쓰지 않은 이유는 ec2:CreateTags 가 배포 역할에 없어서다.
        # 권한을 늘리려면 bootstrap 을 사람이 다시 apply 해야 하는데, 설명
        # 문자열로 같은 일을 할 수 있으면 그쪽이 싸다.
        #
        # 배포는 길어야 몇 분이다. 이 값을 넘겼다면 죽은 규칙이다.
        STALE_AFTER=1800
        now="$(date +%s)"

        # 설명이 정확히 '2jo-deploy' 인 옛 형식은 시각을 알 수 없다.
        # 손대지 않고 알리기만 한다 — 잘못 지우는 쪽이 더 나쁘다.
        aws ec2 describe-security-group-rules \
          --filters "Name=group-id,Values=${sg}" \
          --region "$AWS_REGION" \
          --query "SecurityGroupRules[?starts_with(Description, '2jo-deploy') && IsEgress==\`false\`].[SecurityGroupRuleId,Description]" \
          --output text > "${RUNNER_TEMP}/sg-rules.txt" || true

        # 설명은 "2jo-deploy <시각>" 이라 두 칸으로 갈린다. 앞칸은 안 쓴다.
        while read -r rid _ opened; do
          [ -n "${rid:-}" ] || continue
          if ! printf %s "${opened:-}" | grep -Eq '^[0-9]+$'; then
            echo "::warning::시각이 없는 옛 형식 규칙이다 — 손대지 않는다: ${rid}"
            continue
          fi
          age=$(( now - opened ))
          if [ "$age" -lt "$STALE_AFTER" ]; then
            echo "다른 배포가 방금 연 규칙으로 보인다 — 건드리지 않는다 (${rid}, ${age}초)"
            continue
          fi
          echo "::warning::${age}초 된 22번 규칙을 회수한다: ${rid}"
          # 청소는 보험이다. 여기서 실패했다고 배포를 죽이지 않는다 —
          # 목록을 읽은 뒤 다른 실행이 먼저 지웠으면 NotFound 가 난다.
          aws ec2 revoke-security-group-ingress \
            --group-id "$sg" --security-group-rule-ids "$rid" \
            --region "$AWS_REGION" >/dev/null 2>&1 \
            || echo "::warning::회수 실패 — 이미 사라졌을 수 있다: ${rid}"
        done < "${RUNNER_TEMP}/sg-rules.txt"

        # 러너 공인 IP. 응답이 이상하면 여기서 멈춘다 — 검증 없이 넘기면
        # 쓰레기 값이 CIDR 로 들어가거나, 최악의 경우 의도치 않게 넓게 열린다.
        ip="$(curl -fsS --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]')"
        if ! printf '%s' "$ip" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
          echo "::error::러너 공인 IP 를 확인하지 못했다"
          exit 1
        fi
        echo "러너 IP: ${ip}"

        # 설명에 여는 시각을 함께 남긴다. 위 청소가 이 값으로 살아 있는
        # 규칙과 죽은 규칙을 가른다 (#262).
        rule="$(aws ec2 authorize-security-group-ingress \
          --group-id "$sg" \
          --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${ip}/32,Description=2jo-deploy ${now}}]" \
          --region "$AWS_REGION" \
          --query 'SecurityGroupRules[0].SecurityGroupRuleId' --output text)"
        echo "rule_id=${rule}" >> "$GITHUB_OUTPUT"
        echo "22번 개방: ${ip}/32 (규칙 ${rule})"

    # ── 키와 호스트 키 ───────────────────────────────────────────────────
    # accept-new(TOFU)를 쓰지 않는다. 호스트 키는 인스턴스가 부팅하면서
    # 만들어서 terraform 이 미리 알 수 없고, 그래서 사람이 첫 부팅 뒤에
    # 지문을 Secret 에 넣어둔다. 인스턴스를 재생성하면 다시 넣어야 한다.
    - id: ssh
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-private-key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP}/ssh"
        mkdir -p "$dir" && chmod 700 "$dir"
        umask 077
        printf '%s\n' "$SSH_KEY" > "$dir/id_deploy"
        printf '%s\n' "$KNOWN_HOSTS" > "$dir/known_hosts"
        echo "dir=${dir}" >> "$GITHUB_OUTPUT"

    # ── 접속 확인 ────────────────────────────────────────────────────────
    # 붙을 수 있는지만 먼저 본다. 22번을 연 직후에 바로 접속했다가
    # Connection timed out 으로 죽은 적이 있다 (#258) — refused 가 아니라
    # timed out 이라 패킷이 버려진 것, 즉 방화벽 단계다.
    #
    # 규칙 반영은 보통 1초 안이지만 항상은 아니다. 30초까지 기다린다.
    #
    # 여기서 재시도하는 것은 "붙을 수 있나" 확인뿐이다. .env 전송과
    # deploy.sh 실행은 한 번만 한다 — 중간까지 간 배포를 다시 돌리면
    # 덤프가 두 번 뜨거나 상태가 꼬이고, 진짜 실패를 재시도가 가린다.
    #
    # 정상 경로에서는 첫 시도에 붙어 시간이 늘지 않는다.
    - id: wait
      shell: bash
      env:
        SSH_DIR: ${{ steps.ssh.outputs.dir }}
        TARGET: ${{ inputs.user }}@${{ inputs.host }}
        HOST: ${{ inputs.host }}
        TOLERATE: ${{ inputs.tolerate-missing-host }}
      run: |
        set -uo pipefail
        for i in $(seq 1 6); do
          if ssh \
            -i "$SSH_DIR/id_deploy" \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=5 \
            "$TARGET" true 2>/dev/null; then
            [ "$i" -gt 1 ] && echo "접속 확인 (${i}회차)" || echo "접속 확인"
            exit 0
          fi
          echo "아직 붙지 않는다 (${i}/6)"
          sleep 5
        done

        # 서버가 아직 없는 경우는 호출 쪽이 감수하기로 한 상황이다.
        # 그 판정은 아래 run 스텝이 하므로 여기서 막지 않는다.
        if [ "$TOLERATE" = "true" ]; then
          echo "30초 동안 붙지 못했다 — tolerate-missing-host 라 계속 진행한다"
          exit 0
        fi
        # 22번이 안 붙는 원인은 최소 둘로 갈리는데, 22번만 보면 구분이 안 된다.
        #
        #                     22번   443
        #   호스트가 죽음       X      X
        #   보안그룹 · IP 문제   X      O
        #
        # 443 은 이미 공개망에 열려 있어 추가 권한 없이 확인할 수 있다.
        #
        # HTTP 가 아니라 TCP 연결만 본다. curl 을 쓰면 host 가 도메인이 아니라
        # EIP 일 때 Caddy 가 SNI 없는 TLS 를 거부해 살아 있는 서버도 실패로
        # 나온다(exit 35). 알고 싶은 것은 "무언가 듣고 있는가" 뿐이다.
        #
        # HOST 를 명령 문자열에 끼워넣지 않고 $0 으로 넘긴다. 작은따옴표는
        # 의도한 것이다 — 바깥 셸에서 확장되면 안 넘기느니만 못하다.
        # shellcheck disable=SC2016
        if timeout 6 bash -c 'exec 3<>/dev/tcp/"$0"/443' "$HOST" 2>/dev/null; then
          echo "::error::443 은 응답하는데 22번만 붙지 않는다. 보안그룹 반영 지연이거나 러너 송신 IP 가 다르다"
        else
          echo "::error::22번도 443 도 응답하지 않는다. 서버가 내려갔을 가능성이 높다 — 보안그룹을 먼저 의심하지 말 것"
        fi
        exit 1

    # ── .env 전송 ────────────────────────────────────────────────────────
    # 러너 파일시스템에 쓰지 않고 stdin 으로 흘린다. 서버 쪽 umask 077 로
    # 파일이 생기는 순간부터 권한이 좁다.
    #
    # Parameter Store 를 쓰던 때와 달리 배포 파이프라인이 시크릿을 보게 된다.
    # 이건 SSM 전체를 뺀 결정의 대가이고, 숨기지 않고 적어둔다.
    - id: env
      if: inputs.env-file != ''
      shell: bash
      env:
        ENV_CONTENT: ${{ inputs.env-file }}
        SSH_DIR: ${{ steps.ssh.outputs.dir }}
        TARGET: ${{ inputs.user }}@${{ inputs.host }}
        APP_DIR: ${{ inputs.app-dir }}
      run: |
        set -euo pipefail
        # CR 을 걸러낸다. 시크릿 내용은 우리가 통제할 수 없다 — 윈도우에서
        # 만든 파일을 붙여넣으면 CRLF 가 섞이고, 서버 .env 의 모든 값 끝에
        # CR 이 붙는다. DB_URL 이 jdbc:...twojo 뒤에 CR 이 달려 조용히 깨진다.
        printf '%s\n' "$ENV_CONTENT" | tr -d '\r' | ssh \
          -i "$SSH_DIR/id_deploy" \
          -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
          -o StrictHostKeyChecking=yes \
          -o BatchMode=yes \
          -o ConnectTimeout=15 \
          "$TARGET" "umask 077 && cat > '${APP_DIR}/.env'"
        echo ".env 전송 완료"

    # ── 실행 ─────────────────────────────────────────────────────────────
    # SSH 는 원격 명령의 종료 코드를 그대로 돌려준다. SSM 때 있던
    # 5초/300초 폴링 루프가 통째로 필요 없어진다.
    - id: run
      shell: bash
      env:
        SSH_DIR: ${{ steps.ssh.outputs.dir }}
        TARGET: ${{ inputs.user }}@${{ inputs.host }}
        APP_DIR: ${{ inputs.app-dir }}
        IMAGE: ${{ inputs.image }}
        TOLERATE: ${{ inputs.tolerate-missing-host }}
      run: |
        set -uo pipefail

        if [ -n "$IMAGE" ]; then
          remote="${APP_DIR}/scripts/deploy.sh '${IMAGE}'"
        else
          remote="${APP_DIR}/scripts/deploy.sh"
        fi

        # composite 의 shell: bash 는 기본이 -eo pipefail 이다. 그냥 실행하면
        # 0 이 아닌 순간 스텝이 죽어서 rc 를 잡지 못한다. || 로 받아야 한다.
        # 서버 출력을 파일로도 남긴다. 호출 쪽이 요약에 올린다 (#260).
        # 로그를 펼쳐야 보이는 정보는 못 본 정보다.
        #
        # tee 를 걸어도 종료 코드는 보존된다 — 이 셸은 pipefail 이라
        # 파이프라인이 ssh 의 실패를 그대로 돌려준다.
        log="${RUNNER_TEMP}/remote-deploy.log"

        rc=0
        ssh -i "$SSH_DIR/id_deploy" \
          -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
          -o StrictHostKeyChecking=yes \
          -o BatchMode=yes \
          -o ConnectTimeout=15 \
          "$TARGET" "$remote" 2>&1 | tee "$log" || rc=$?

        {
          echo "rc=${rc}"
          echo "log=${log}"
        } >> "$GITHUB_OUTPUT"
        echo "deploy.sh 종료 코드: ${rc}"

        # ssh 자체가 붙지 못한 경우(255)와 서버가 아직 없는 경우를 구분한다.
        if [ "$rc" = "255" ] && [ "$TOLERATE" = "true" ]; then
          echo "::notice::서버에 접속하지 못했다 — 아직 인스턴스가 없으면 정상이다"
          exit 0
        fi
        exit "$rc"

    # ── 회수 ─────────────────────────────────────────────────────────────
    # always() 다. 실패해도 취소해도 22번은 닫혀야 한다.
    - name: 22번 회수
      if: always() && steps.open.outputs.rule_id != ''
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws-region }}
        SG: ${{ steps.open.outputs.security_group }}
        RULE: ${{ steps.open.outputs.rule_id }}
      run: |
        set -uo pipefail
        ok=0
        aws ec2 revoke-security-group-ingress \
          --group-id "$SG" --security-group-rule-ids "$RULE" \
          --region "$AWS_REGION" >/dev/null || ok=$?

        if [ "$ok" -eq 0 ]; then
          echo "22번 회수 완료 (${RULE})"
          exit 0
        fi

        # 여기서 실패하면 규칙이 남는다. 다음 배포의 개방 스텝이 정리하지만
        # 그때까지는 열려 있으므로 조용히 넘기지 않는다.
        echo "::error::22번 규칙 ${RULE} 회수에 실패했다. 콘솔에서 직접 지울 것"
        exit 1
