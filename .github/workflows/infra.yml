# 인프라 CI — infra/prod/terraform/** 를 머지 전에 검증한다 (이슈 #88)
#
# 워크플로 레벨 paths 필터를 쓰지 않는다. 이유가 둘이다.
#
# PR 에서는 ci.yml 과 같은 이유 — required check 로 지정되면 워크플로가 아예 안 돈
# PR 에서 체크가 pending 으로 남아 머지가 영원히 막힌다. 잡 레벨 if 스킵은
# "skipped" 로 보고되어 통과시킨다.
#
# push 에서는 목록이 두 벌이 되기 때문이다. 실제로 어긋났다 — 설정 번들 경로를
# changes 필터에만 추가한 탓에, 캐디·모니터링 설정을 고쳐도 워크플로가 시작조차
# 하지 않았다. 무엇이 바뀌었는지는 changes 잡 하나만 안다.
#
# 잡 구성
#   terraform-check  fmt · validate         자격증명 불필요
#   tflint           프로바이더 규칙 위반    자격증명 불필요
#   checkov          보안 오설정             자격증명 불필요
#   infracost        월 비용 한도 게이트      INFRACOST_API_KEY 필요
#   terraform-plan   PR 에 plan 결과 코멘트   OIDC 역할 필요 (bootstrap apply 이후)
#   terraform-apply  develop 머지 후 적용     OIDC 역할 + Environment 승인
#
# bootstrap/ 는 plan·apply 대상이 아니다. 사람이 로컬에서 1회 돌리는 스택이고,
# CI 가 apply 하면 상태 버킷 자체를 CI 가 흔들게 된다. 정적 검사만 받는다.
name: infra

on:
  pull_request:
    branches: [develop, 'release/**', main]
  # push 에도 paths 를 두지 않는다. 여기와 아래 changes 필터에 목록이 두 벌
  # 있었고, 설정 번들 경로를 changes 쪽에만 추가한 탓에(#206) 캐디·모니터링
  # 설정을 고쳐도 워크플로가 아예 시작되지 않았다. apply 가 안 도니 S3 가
  # 그대로 남고, 서버는 계속 옛 파일을 받아갔다.
  #
  # 무엇이 바뀌었는지는 changes 잡 하나만 안다. 아래 모든 잡이 그 출력으로
  # 걸러지므로, 관계없는 머지에서는 changes 만 돌고 15초 안에 끝난다.
  push:
    branches: [develop]

concurrency:
  # apply 를 중간에 끊으면 상태가 깨진다. PR 검사만 취소한다.
  group: infra-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TF_ROOT: infra/prod/terraform
  TF_VERSION: 1.15.8
  TFLINT_VERSION: v0.64.0
  TF_IN_AUTOMATION: 'true'

jobs:
  changes:
    name: infra-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      scripts: ${{ steps.filter.outputs.scripts }}
      config: ${{ steps.filter.outputs.config }}
      workflows: ${{ steps.filter.outputs.workflows }}
      aws_ready: ${{ steps.gate.outputs.aws_ready }}
      state_ready: ${{ steps.gate.outputs.state_ready }}
      infracost_ready: ${{ steps.gate.outputs.infracost_ready }}
      stack_ready: ${{ steps.gate.outputs.stack_ready }}
      tfvars_ready: ${{ steps.gate.outputs.tfvars_ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/prod/terraform/**'
              - '.github/workflows/infra.yml'
              # terraform apply 가 이 파일들을 S3 config/ 로 올린다
              # (modules/storage/config_sync.tf 의 config_dirs).
              # 여기 없으면 파일을 고쳐도 apply 가 돌지 않아 S3 가
              # 그대로 남고, 서버는 계속 옛 파일을 받아간다.
              - 'infra/prod/compose/**'
              - 'infra/prod/caddy/**'
              - 'infra/prod/scripts/**'
              - 'infra/prod/monitoring/**'
              - 'infra/prod/systemd/**'
            scripts:
              - 'infra/**/*.sh'
              - '.github/workflows/infra.yml'
            config:
              - 'infra/prod/compose/**'
              - 'infra/prod/caddy/**'
              - 'infra/prod/monitoring/**'
              - 'infra/prod/systemd/**'
              - 'infra/prod/.env.example'
              # 앱이 요구하는 키가 늘면 .env.example 도 따라와야 한다
              - 'backend/src/main/resources/application.yml'
              - '.github/workflows/infra.yml'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'

      # 아직 없는 것들 때문에 CI 가 빨간불로 남지 않게 한다.
      # bootstrap apply 전에는 OIDC 역할이 없고, 메인 스택 코드도 아직 없다.
      # 준비되면 시크릿·코드가 생기면서 해당 잡이 저절로 켜진다.
      - id: gate
        shell: bash
        env:
          HAS_PLAN_ROLE: ${{ secrets.AWS_TF_PLAN_ROLE_ARN != '' }}
          # backend.tf 에 bucket 이 없다(계정 ID 를 코드에 박지 않는다).
          # 없으면 terraform init 이 "The attribute bucket is required" 로
          # 죽는다 — plan·apply 의 첫 줄이다.
          HAS_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET != '' }}
          HAS_INFRACOST_KEY: ${{ secrets.INFRACOST_API_KEY != '' }}
          # key_name·deploy_public_key 는 기본값이 없다. 없는 채로 -input=false
          # 로 돌면 "No value for required variable" 로 죽는다. 시크릿이 아니라
          # 공개키와 키페어 이름이므로 variable 로 받는다.
          HAS_TFVARS: ${{ vars.SSH_KEY_NAME != '' && vars.DEPLOY_PUBLIC_KEY != '' }}
        run: |
          set -euo pipefail
          {
            echo "aws_ready=${HAS_PLAN_ROLE}"
            echo "state_ready=${HAS_STATE_BUCKET}"
            echo "infracost_ready=${HAS_INFRACOST_KEY}"
            echo "tfvars_ready=${HAS_TFVARS}"
            # 메인 스택은 TF_ROOT 바로 아래 .tf 파일. bootstrap/ 은 여기 해당 없음
            if compgen -G "${TF_ROOT}/*.tf" > /dev/null; then
              echo "stack_ready=true"
            else
              echo "stack_ready=false"
            fi
          } >> "$GITHUB_OUTPUT"

  # ── 자격증명 없이 도는 검사 3종 ─────────────────────────────────
  terraform-check:
    name: terraform-check
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: fmt
        working-directory: ${{ env.TF_ROOT }}
        run: terraform fmt -check -recursive -diff

      # 스택이 늘어나도 워크플로를 고치지 않도록 .tf 가 있는 디렉터리를 찾아 전부 돈다.
      - name: validate
        working-directory: ${{ env.TF_ROOT }}
        run: |
          set -euo pipefail
          dirs=$(find . -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u)
          if [ -z "$dirs" ]; then
            echo "::error::검사할 terraform 디렉터리를 찾지 못했다"
            exit 1
          fi
          for dir in $dirs; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

  # 보안그룹 설명은 tflint 가 보지 않는다(IAM 역할 설명 규칙은 있는데
  # 보안그룹 규칙 설명 규칙은 aws 룰셋 0.48.0 에 없다). AWS 가 거부하는
  # 문자가 들어가면 plan 은 통과하고 apply 가 400 으로 죽는다 —
  # 그것도 절반쯤 만들어진 채로.
  sg-description:
    name: sg-description
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check-sg-descriptions.py "${TF_ROOT}"

  tflint:
    name: tflint
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        working-directory: ${{ env.TF_ROOT }}
        env:
          # 플러그인 다운로드가 GitHub API 레이트리밋에 걸리는 것을 막는다
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cfg="$PWD/.tflint.hcl"
          tflint --init --config="$cfg"
          for dir in $(find . -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u); do
            echo "::group::tflint $dir"
            tflint --chdir="$dir" --config="$cfg" --format=compact
            echo "::endgroup::"
          done

  shellcheck:
    name: shellcheck
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest 러너에 shellcheck 가 미리 깔려 있다.
      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(find infra -name '*.sh' -not -path '*/.terraform/*' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "검사할 스크립트가 없다"
            exit 0
          fi
          for f in "${files[@]}"; do echo "검사 대상: $f"; done
          # SC2154 만 끈다. terraform templatefile 자리표시자(${var})를
          # 미할당 셸 변수로 오인하기 때문이다. 나머지 경고는 전부 실패로 본다.
          shellcheck --exclude=SC2154 "${files[@]}"

  # 워크플로 YAML 은 지금까지 아무도 검사하지 않았다. 틀리면 머지된 뒤에야
  # 드러나고, 배포 워크플로에서 그러면 서버 앞에서 멈춘다.
  #
  # actionlint 는 composite action(action.yml)을 이해하지 못한다 — 워크플로만
  # 본다. 그래서 액션의 run 블록은 따로 뽑아 shellcheck 에 건다.
  workflow-lint:
    name: workflow-lint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: composite action 의 run 블록 shellcheck
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          python3 .github/scripts/extract-action-scripts.py "$out"
          shopt -s nullglob
          files=("$out"/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "composite action 이 없다"
            exit 0
          fi
          # SC2154 만 끈다 — 워크플로 스크립트도 env 로 주입받는 변수를 쓴다.
          shellcheck --exclude=SC2154 "${files[@]}"

  config-check:
    name: config-check
    needs: changes
    if: needs.changes.outputs.config == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 서버에서 실제로 도는 설정들이다. 눈으로 봐서는 맞는지 알 수 없고,
      # 틀리면 배포 시점에야 드러난다. 각 도구 자신에게 물어본다.
      # 실제 서버 배치와 같은 위치에 둔다. compose.yml 의 env_file 이
      # ../.env 를 가리키므로 /tmp 에 두면 파싱 자체가 실패한다.
      # .env.example 이 필요한 키의 유일한 출처다. 여기에 목록을 또 적으면
      # 두 벌이 되고, 한쪽만 고치는 순간 어긋난다 — 실제로 그랬다.
      - name: 키 목록이 앱·compose 와 맞는가
        run: python3 .github/scripts/check-env-keys.py .

      - name: 더미 env 준비
        run: |
          set -euo pipefail
          cp infra/prod/.env.example infra/prod/.env
          echo 'BACKEND_IMAGE=example/backend:test' > infra/prod/.env.image

      - name: Caddyfile
        run: |
          docker run --rm -e ACME_EMAIL=ops@example.com -e DOMAIN=example.com             -v "$PWD/infra/prod/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"             caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: prometheus.yml
        run: |
          docker run --rm --entrypoint promtool             -v "$PWD/infra/prod/monitoring/prometheus:/cfg:ro"             prom/prometheus:v3.2.1 check config /cfg/prometheus.yml

      - name: promtail.yml
        run: |
          docker run --rm -v "$PWD/infra/prod/monitoring/promtail:/cfg:ro"             grafana/promtail:3.4.2 -config.file=/cfg/promtail.yml -check-syntax

      - name: loki-config.yml
        run: |
          docker run --rm -v "$PWD/infra/prod/monitoring/loki:/cfg:ro"             grafana/loki:3.4.2 -config.file=/cfg/loki-config.yml -verify-config

      - name: compose (2개 파일 병합)
        run: |
          docker compose --env-file infra/prod/.env --env-file infra/prod/.env.image             -f infra/prod/compose/compose.yml             -f infra/prod/compose/compose.monitoring.yml config --quiet

      # 가장 잘 깨지는 곳이다. Grafana 알람 provisioning 은 형식이 조금만
      # 어긋나도 오류 없이 그냥 등록되지 않는다 — 알람이 조용히 사라진다.
      # 유닛 파일이 틀리면 배포는 성공하는데 백업만 조용히 안 돈다.
      # 그건 25시간 뒤 알람으로만 드러나므로 여기서 먼저 잡는다 (이슈 #159).
      - name: systemd 유닛
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/2jo/scripts
          echo '#!/bin/sh' | sudo tee /opt/2jo/scripts/backup.sh >/dev/null
          sudo chmod +x /opt/2jo/scripts/backup.sh
          cp infra/prod/systemd/backup.service infra/prod/systemd/backup.timer /tmp/
          systemd-analyze verify --user /tmp/backup.timer
          # OnCalendar 가 파싱되는지, 실제로 하루 한 번인지 확인한다
          systemd-analyze calendar --iterations=2 '*-*-* 19:00:00 UTC'

      - name: Grafana provisioning (실제 기동)
        run: |
          set -euo pipefail
          docker run -d --name gf-check             -e DISCORD_WEBHOOK_URL="https://discord.com/api/webhooks/0/x"             -e GF_SECURITY_ADMIN_PASSWORD=ci-only             -v "$PWD/infra/prod/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"             grafana/grafana:11.6.1

          for _ in $(seq 1 60); do
            if docker logs gf-check 2>&1 | grep -q "HTTP Server Listen"; then break; fi
            sleep 2
          done

          rules="$(docker exec gf-check sh -c             'curl -sf -u admin:ci-only http://localhost:3000/api/v1/provisioning/alert-rules'             | grep -o '"uid":"2jo-[^"]*"' | wc -l)"
          echo "등록된 2jo 알람 규칙: ${rules}개"

          docker logs gf-check 2>&1 | grep "level=error" || true

          docker rm -f gf-check > /dev/null

          # 개수를 코드에 박아두면 알람을 하나 추가할 때마다 여기가 깨진다.
          # 이 검사가 막으려는 건 그게 아니라 "형식이 틀린 규칙을 Grafana 가
          # 조용히 버리는 것" 이다. 그러니 파일에 선언된 개수와 대조한다.
          declared="$(python3 -c "
          import yaml
          d = yaml.safe_load(open('infra/prod/monitoring/grafana/provisioning/alerting/rules.yml'))
          print(sum(len(g['rules']) for g in d['groups']))
          ")"
          echo "rules.yml 에 선언된 규칙: ${declared}개"

          if [ "$rules" -ne "$declared" ]; then
            echo "::error::선언은 ${declared}개인데 Grafana 가 ${rules}개만 등록했다. 규칙 하나가 조용히 버려졌다"
            exit 1
          fi

          # 알람 개수 상한은 별개 관심사다. 울려도 아무도 안 보게 되면 0개와 같다.
          # 늘려야 한다면 그건 의식적인 결정이어야 하므로 여기서 한 번 막는다.
          if [ "$declared" -gt 8 ]; then
            echo "::error::알람이 ${declared}개다. 상한(8)을 넘기려면 이 줄을 함께 고칠 것"
            exit 1
          fi

  checkov:
    name: checkov
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF 업로드 (PR 라인 어노테이션)
    steps:
      - uses: actions/checkout@v4

      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/prod/terraform
          config_file: infra/prod/terraform/.checkov.yaml
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false

      - name: SARIF 업로드
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov

  # ── 비용 게이트 — PR 단계에서 월 예상 비용을 막는다 ──────────────
  # 3계층 중 유일하게 "돈이 나가기 전에" 막는다.
  # IAM Deny 는 apply 시점, Budgets 는 이미 쓴 뒤다.
  infracost:
    name: infracost
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.infra == 'true' &&
      needs.changes.outputs.infracost_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # 자체 예산은 8만원(약 $57). 그 아래에 머물도록 $55 에서 막는다.
      #
      # 예산 위로 올리지 않는 것이 핵심이다. 비용 가드(Budgets·IAM Deny)를
      # 협의로 제거해서 AWS 쪽 지출 차단이 없다 — 이 게이트를 통과하면
      # 그 뒤에는 아무것도 막지 않는다.
      #
      # 현재 예상 $49. 여유 $6 은 리소스 한둘을 더할 만큼이고, 그보다 큰
      # 변경은 예산 자체를 다시 보라는 뜻이다.
      COST_LIMIT: ${{ vars.INFRACOST_COST_LIMIT || '55' }}
    steps:
      - uses: actions/checkout@v4
      - uses: infracost/actions/setup@v4
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # plan 이 아니라 HCL 을 직접 파싱한다 — AWS 자격증명 없이 돈다.
      - name: 비용 산출
        run: infracost breakdown --path="${TF_ROOT}" --format=json --out-file=/tmp/infracost.json

      # infracost/actions@v4 에는 comment 서브액션이 없다 (setup·diff·scan 뿐).
      # CLI 를 직접 부른다.
      - name: PR 코멘트
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          infracost comment github \
            --path=/tmp/infracost.json \
            --repo="${GITHUB_REPOSITORY}" \
            --pull-request="${{ github.event.pull_request.number }}" \
            --github-token="${GITHUB_TOKEN}" \
            --behavior=update

      # 증분(diff)이 아니라 총액으로 판정한다.
      # diff 게이트는 "최초 인프라 PR 은 당연히 한도를 넘는다"($0 → $37) 문제가 생겨
      # baseline 파일이나 우회 라벨이 필요하다. 총액 게이트는 그 문제가 없다.
      - name: 한도 게이트
        run: |
          set -euo pipefail
          total=$(jq -r '.totalMonthlyCost // "0"' /tmp/infracost.json)
          echo "월 예상 비용 ${total} / 한도 ${COST_LIMIT} (USD)"
          if awk -v t="$total" -v l="$COST_LIMIT" 'BEGIN { exit !(t > l) }'; then
            echo "::error::월 예상 비용 ${total} USD 가 한도 ${COST_LIMIT} USD 를 넘었다"
            exit 1
          fi
          echo "한도 이내"

  # ── AWS 자격증명이 필요한 잡 ────────────────────────────────────
  # bootstrap apply 로 OIDC 역할이 생기고 메인 스택 코드가 들어오면 켜진다.
  terraform-plan:
    name: terraform-plan
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.infra == 'true' &&
      needs.changes.outputs.aws_ready == 'true' &&
      needs.changes.outputs.state_ready == 'true' &&
      needs.changes.outputs.stack_ready == 'true' &&
      needs.changes.outputs.tfvars_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC 토큰 발급
      pull-requests: write
    env:
      TF_VAR_key_name: ${{ vars.SSH_KEY_NAME }}
      TF_VAR_deploy_public_key: ${{ vars.DEPLOY_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TF_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: plan
        working-directory: ${{ env.TF_ROOT }}
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color \
            -backend-config="bucket=${TF_STATE_BUCKET}"
          terraform plan -input=false -no-color -lock-timeout=120s | tee /tmp/plan.txt

      - name: PR 코멘트
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('/tmp/plan.txt', 'utf8');
            // 코멘트 상한(65536자)을 넘지 않게 뒤에서 자른다 — 요약은 마지막에 나온다
            const plan = raw.length > 60000 ? '...(앞부분 생략)\n' + raw.slice(-60000) : raw;
            const marker = '<!-- terraform-plan -->';
            const fence = '```';
            const body = marker + '\n### terraform plan\n\n' + fence + 'hcl\n' + plan + '\n' + fence;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const prev = comments.find(c => c.body && c.body.startsWith(marker));
            if (prev) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: context.issue.number, body,
              });
            }

  terraform-apply:
    name: terraform-apply
    needs: changes
    # infra 조건이 여기 있어야 한다. 예전에는 워크플로 레벨 paths 가 그 몫을
    # 대신했는데, 그 목록이 changes 필터와 어긋나 사고가 났다. 이제 판단은
    # changes 한 곳에서만 한다.
    if: >-
      github.event_name == 'push' &&
      needs.changes.outputs.infra == 'true' &&
      needs.changes.outputs.aws_ready == 'true' &&
      needs.changes.outputs.state_ready == 'true' &&
      needs.changes.outputs.stack_ready == 'true' &&
      needs.changes.outputs.tfvars_ready == 'true'
    runs-on: ubuntu-latest
    # 승인 게이트. Environment 에 Required reviewers 를 걸면
    # 승인 전에는 OIDC 토큰 자체가 발급되지 않는다 — 브랜치 기준으로는 안 되는 것
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_key_name: ${{ vars.SSH_KEY_NAME }}
      TF_VAR_deploy_public_key: ${{ vars.DEPLOY_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_TF_APPLY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: apply
        working-directory: ${{ env.TF_ROOT }}
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color \
            -backend-config="bucket=${TF_STATE_BUCKET}"
          terraform apply -input=false -no-color -auto-approve -lock-timeout=300s

      # apply 는 설정 번들을 S3 config/ 에 올릴 뿐이다. 이 단계가 없으면
      # S3 만 바뀌고 서버는 옛 설정으로 계속 돈다 (cd.md §9.3).
      #
      # 이미지는 건드리지 않는 설정 전용 모드다. .env 도 보내지 않는다 —
      # 이미 서버에 있고, 여기서 다시 보내면 시크릿이 한 경로 더 지나간다.
      #
      # 서버가 아직 없으면 접속이 실패하는데 그건 정상이므로 워크플로를
      # 깨지 않는다(tolerate-missing-host).
      # secrets 컨텍스트는 스텝 if: 에서 못 쓴다. env 로 한 번 받아 출력으로 넘긴다.
      - id: sshgate
        env:
          OK: ${{ secrets.DEPLOY_HOST != '' && secrets.SSH_PRIVATE_KEY != '' && secrets.SSH_KNOWN_HOSTS != '' }}
        run: echo "ok=${OK}" >> "$GITHUB_OUTPUT"

      - name: 서버에 설정 재동기화 (설정 전용 배포)
        if: steps.sshgate.outputs.ok == 'true'
        uses: ./.github/actions/remote-deploy
        with:
          aws-region: ap-northeast-2
          security-group-name: 2jo-web
          host: ${{ secrets.DEPLOY_HOST }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          tolerate-missing-host: 'true'
