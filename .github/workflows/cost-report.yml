# 일일 누적 비용 리포트 + 백스톱 정지 (이슈 #89)
#
# AWS Budgets 는 달력 월 기준이라 매월 1일에 리셋된다. 이 프로젝트는 9~10월을
# 걸치므로 총액은 Budgets 로 못 지킨다. 이 잡이 PROJECT_START_DATE 부터
# 누적해서 재고, 한도를 넘으면 직접 인스턴스를 멈춘다.
#
# 리포트 자체가 heartbeat 다. 아침에 아무것도 안 오면 그것도 신호다 —
# 잡이 안 돌면 달 경계 방어가 통째로 사라진다 (cost-guard.md §4.5).
name: cost-report

on:
  schedule:
    # UTC 00:00 = 09:00 KST. 스케줄 잡은 기본 브랜치(develop)에서만 돈다.
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: cost-report
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    name: cost-report
    runs-on: ubuntu-latest

    # 배포 역할과 분리된 신원을 쓴다. ce:* 와 ec2:StopInstances 를 배포 역할에
    # 주면, 배포 워크플로가 탈취됐을 때 서비스를 멈출 수 있게 된다.
    # 승인자는 붙이지 않는다 — 새벽 크론이 승인 대기로 멈추면 감시가 사라진다.
    environment: cost-guard

    permissions:
      contents: read
      id-token: write # OIDC

    env:
      PROJECT_START_DATE: ${{ vars.PROJECT_START_DATE }}
      BUDGET_LIMIT_USD: ${{ vars.BUDGET_LIMIT_USD || '50' }}
      PROJECT_TAG: '2jo'
      AWS_REGION: ap-northeast-2

    steps:
      - uses: actions/checkout@v4

      - name: 선행 조건 확인
        # 없는 채로 돌면 Discord 없이 조용히 실패한다. 먼저 이유를 알려준다.
        env:
          HAS_ROLE: ${{ secrets.AWS_GHA_COST_ROLE_ARN != '' }}
          HAS_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        run: |
          set -euo pipefail
          missing=""
          [ "$HAS_ROLE" = "true" ]    || missing="$missing AWS_GHA_COST_ROLE_ARN(secret)"
          [ "$HAS_WEBHOOK" = "true" ] || missing="$missing DISCORD_WEBHOOK_URL(secret)"
          [ -n "$PROJECT_START_DATE" ] || missing="$missing PROJECT_START_DATE(variable)"
          if [ -n "$missing" ]; then
            echo "::error::등록되지 않은 설정:$missing"
            exit 1
          fi
          echo "선행 조건 충족"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GHA_COST_ROLE_ARN }}
          aws-region: ap-northeast-2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --disable-pip-version-check boto3

      - name: 누적 비용 리포트
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python infra/prod/scripts/cost_report.py

      # 달 경계 방어가 이 잡 하나에 걸려 있다. 실패를 조용히 넘기면 안 된다.
      - name: 실패 알림
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "${DISCORD_WEBHOOK_URL:-}" ] || { echo "웹훅이 없어 알림을 보낼 수 없다"; exit 0; }
          payload=$(printf '{"embeds":[{"title":"비용 감시 잡 실패","description":"달 경계 방어가 열렸습니다. 수동 확인 필요.\\n%s","color":10038562}]}' "$RUN_URL")
          curl -sS -X POST "$DISCORD_WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload"
