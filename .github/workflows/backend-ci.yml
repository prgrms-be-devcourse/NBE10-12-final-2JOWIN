# Backend CI — docs/13-dev-workflow.md §3
#
# build / flyway-validate / flyway-version-check 3잡이 required check (머지 차단).
# 프론트 검증은 frontend-ci.yml 로 분리했다 (ci-cd.md §4).
#
# 잡 이름은 룰셋에 문자열로 박혀 있다. 바꾸면 그 이름의 체크가 영원히
# 보고되지 않아 PR 이 머지 불가로 남는다 — 오류도 안 나고 그냥 대기한다.
name: Backend CI

on:
  pull_request:
    branches: [develop, 'release/**', main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 변경 경로 감지 — docs 등 코드 무관 PR에서는 무거운 잡을 스킵한다.
  # 잡 레벨 if 스킵은 "skipped"로 보고되어 required check를 통과시킨다
  # (워크플로 레벨 paths-ignore는 체크가 pending으로 남아 머지가 막히므로 금지)
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 워크플로 파일 변경 시엔 전 잡 재검증
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-ci.yml'

  build:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # 컴파일 + 테스트(스키마 검증 포함) + SpotBugs — 잡 이름은 required check로 참조되므로 짧게 유지
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write     # JaCoCo 커버리지 코멘트
      security-events: write   # SpotBugs SARIF 업로드 (PR 어노테이션)
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: twojo
          POSTGRES_PASSWORD: twojo
          POSTGRES_DB: twojo_test
        ports:
          - 5433:5432   # application-test.yml과 동일 좌표
        options: >-
          --health-cmd "pg_isready -U twojo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & Test
        # 컴파일 + 테스트(스키마 검증 포함 — 서비스 컨테이너 PG) + 정적 분석(spotbugs)
        run: ./gradlew build

      # ── PR 피드백 — 실패해도 리포트는 남기도록 always()
      - name: JaCoCo 커버리지 PR 코멘트
        if: always() && github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: backend/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 📊 테스트 커버리지
          update-comment: true
          # 커버리지 목표는 팀 미결정 — 0이면 정보 표시만. 목표 합의 시 여기 숫자만 올린다
          min-coverage-overall: 0
          min-coverage-changed-files: 0

      - name: SpotBugs 결과 업로드 (PR 라인 어노테이션)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/build/reports/spotbugs/main.sarif
          category: spotbugs

  flyway-validate:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # 실제 PG에 마이그레이션 적용·검증
    name: flyway-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: twojo
          POSTGRES_PASSWORD: twojo
          POSTGRES_DB: twojo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U twojo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Flyway Migrate + Validate
        run: ./gradlew flywayMigrate flywayValidate
        env:
          FLYWAY_URL: jdbc:postgresql://localhost:5433/twojo
          FLYWAY_USER: twojo
          FLYWAY_PASSWORD: twojo

  # 롤백은 이미지만 되돌린다. Flyway 가 이미 적용한 스키마는 새 상태로
  # 남고, 옛 코드가 그 위에서 돌지 못하면 롤백해도 서비스가 복구되지
  # 않는다 — 컬럼을 지우는 마이그레이션이 그렇다.
  #
  # 승인 게이트로는 못 막는다. 사람이 승인 화면에서 보는 것은 커밋
  # 목록뿐이고, 그 안에 파괴적 SQL 이 있는지는 보이지 않는다.
  #
  # 막는 것이 목적이 아니라 의식적인 결정으로 만드는 것이 목적이다.
  # 의도한 경우에는 destructive-migration 라벨로 통과시킨다.
  destructive-migration:
    name: destructive-migration
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'destructive-migration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check-destructive-migrations.py backend/src/main/resources/db/migration

  flyway-version-check:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # 마이그레이션 버전 번호 중복 검사
    name: flyway-version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 중복 버전 검사
        run: |
          cd backend/src/main/resources/db/migration
          dup=$(find . -maxdepth 1 -name 'V*.sql' -printf '%f\n' | sed -E 's/^(V[0-9]+)__.*/\1/' | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::error::중복된 Flyway 버전이 있습니다: $dup"
            echo "도메인 번호대를 확인하세요 — A=1xx · B=2xx · C=3xx · D=4xx (docs/13-dev-workflow.md §0.2)"
            exit 1
          fi
          echo "버전 중복 없음"

