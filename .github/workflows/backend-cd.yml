# 백엔드 배포 (이슈 #93)
#
# 원칙: 22번을 상시 열지 않는다.
#   이미지는 ECR 로 가고, 명령은 SSH 로 간다. 22번은 배포하는 동안만
#   러너 공인 IP /32 로 열렸다가 회수된다 (.github/actions/remote-deploy).
#
# 승인 게이트가 보안 장치이기도 하다. 배포 역할의 신뢰 조건이
# repo:<org>/<repo>:environment:prod 라서, 승인 전에는 OIDC 토큰 자체가
# 발급되지 않는다. 브랜치 보호가 '코드가 들어오는 것'을 막는다면
# 이건 'AWS 를 만지는 것'을 막는다.
#
# 설계 근거: cd.md
name: Backend CD

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'infra/prod/docker/**'
      - '.github/workflows/backend-cd.yml'
      - '.github/actions/remote-deploy/**'
  workflow_dispatch:
    inputs:
      config_only:
        description: '이미지를 바꾸지 않고 설정만 다시 내린다'
        type: boolean
        default: false

concurrency:
  # 진행 중인 배포를 취소하면 EC2 가 어중간한 상태로 남는다 —
  # 이미지는 새 것인데 헬스체크·롤백이 끝나지 않은 상태.
  # 취소가 아니라 줄 세우기여야 한다.
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: 2jo-backend
  SECURITY_GROUP_NAME: 2jo-web

jobs:
  preflight:
    name: 사전 점검
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      # 시크릿이 없으면 조용히 스킵한다. bootstrap apply 전에 develop 에
      # 백엔드 커밋이 들어올 때마다 빨간불이 뜨면 안 된다.
      #
      # SSH 로 바뀌면서 필요한 시크릿이 늘었다. 하나라도 없으면 배포가
      # 중간에 죽는데, 그때는 이미 ECR 에 이미지가 올라간 뒤다.
      - id: gate
        env:
          HAS_ALL: ${{ secrets.AWS_GHA_DEPLOY_ROLE_ARN != ''
            && secrets.DEPLOY_HOST != ''
            && secrets.SSH_PRIVATE_KEY != ''
            && secrets.SSH_KNOWN_HOSTS != ''
            && secrets.PROD_ENV_FILE != '' }}
        run: echo "ready=${HAS_ALL}" >> "$GITHUB_OUTPUT"

  deploy:
    name: 배포
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'

    # 인스턴스가 t3.medium(x86_64)이라 러너와 아키텍처가 같다.
    # 에뮬레이션이 필요 없어 그냥 빌드하면 된다.
    runs-on: ubuntu-latest

    # 이 환경에는 승인자가 없다. 팀원 5명이 머지하는데 승인자 1명이 매번
    # 챙기는 것은 현실적이지 않고, 결국 "일단 승인" 이 되어 게이트가 형식만
    # 남는다. 인프라 apply 는 여전히 prod(승인 있음)를 쓴다.
    #
    # environment 를 지우면 안 된다. 배포 역할의 신뢰 조건이
    # environment:<이름> 이라, 빼면 OIDC 토큰의 sub 가 달라져 AWS 접근
    # 자체가 막힌다. 승인은 환경 설정에서 빼는 것이지 이 줄이 아니다.
    environment: prod-deploy

    # SSH 가 종료 코드를 직접 돌려주므로 폴링 상한 대신 job 타임아웃으로 막는다.
    # 최악 케이스 290초(pull 30 + up 10 + health 90 + 타깃확인 60 + 롤백 10 + health 90)에
    # 빌드·push 를 더해도 넉넉하다.
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write # OIDC

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Java 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4

      # CI 가 PR 에서 이미 테스트까지 통과시켰다. 여기서는 jar 만 만든다.
      - name: 1. jar 빌드
        if: ${{ !inputs.config_only }}
        working-directory: backend
        run: ./gradlew bootJar

      - name: AWS 자격 취득 (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        name: 2. ECR 로그인
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          echo "image=${registry}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"

      # 태그는 git SHA 뿐이다. latest 를 쓰지 않아 ECR 이 IMMUTABLE 일 수 있고,
      # 그래서 "직전 SHA 로 롤백"이 언제나 같은 이미지를 가리킨다.
      # 태그가 이미 있으면 아무것도 하지 않는다.
      #
      # ECR 이 IMMUTABLE 이라 같은 태그를 다시 밀면 거부된다. 그래서 push
      # 뒤에 배포가 실패하면 그 커밋은 재실행으로도 배포할 수 없었다 —
      # 새 커밋이 들어와 태그가 달라져야만 풀리는 막다른 길이었다 (#258).
      #
      # 건너뛰어도 안전하다. 태그가 커밋 SHA 라 같은 태그는 같은 커밋이고
      # 같은 내용이다. 다시 빌드해도 나올 것이 이미 거기 있다.
      #
      # IMMUTABLE 을 포기하지 않는다. 그 덕에 "직전 SHA 로 롤백"이 언제나
      # 같은 이미지를 가리킨다.
      - name: 3. 이미지 빌드 · 푸시
        if: ${{ !inputs.config_only }}
        env:
          IMAGE: ${{ steps.ecr.outputs.image }}
        run: |
          set -euo pipefail

          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "이미 올라간 태그다 — 빌드·푸시를 건너뛴다 (${GITHUB_SHA})"
            exit 0
          fi

          docker build \
            -f infra/prod/docker/backend.Dockerfile \
            -t "$IMAGE" \
            backend/
          docker push "$IMAGE"

      # 표현식으로 쓰지 않는다. GitHub Actions 에는 삼항 연산자가 없어서
      # `조건 && A || B` 를 흉내내는데, A 가 falsy 면 그 관용구가 깨진다.
      #
      #   inputs.config_only && '' || steps.ecr.outputs.image
      #   → true && ''  는 ''  이고, '' 는 falsy 라 || 가 이미지를 돌려준다
      #
      # 그래서 설정 전용 배포인데도 이미지를 받으러 갔고, 빌드는 건너뛴
      # 뒤라 ECR 에 그 태그가 없어 manifest unknown 으로 죽었다.
      # 여기서 A 는 언제나 빈 문자열이므로 관용구를 고쳐 쓸 여지가 없다.
      - id: target
        name: 4. 배포할 이미지 결정
        env:
          CONFIG_ONLY: ${{ inputs.config_only }}
          ECR_IMAGE: ${{ steps.ecr.outputs.image }}
        run: |
          set -euo pipefail
          if [ "${CONFIG_ONLY}" = "true" ]; then
            echo "설정 전용 — 이미지를 바꾸지 않는다"
            echo "image=" >> "$GITHUB_OUTPUT"
          else
            echo "image=${ECR_IMAGE}" >> "$GITHUB_OUTPUT"
          fi

      # 여기서 22번이 열리고, deploy.sh 가 돌고, 규칙이 회수된다.
      # 종료 코드는 SSH 가 그대로 돌려준다 — 결과 폴링이 필요 없다.
      #
      # continue-on-error 인 이유: 실패해도 Discord 통보까지는 가야 한다.
      # job 성패는 맨 아래에서 종료 코드로 다시 판정한다.
      - id: deploy
        name: 5. 배포 (SSH)
        continue-on-error: true
        uses: ./.github/actions/remote-deploy
        with:
          aws-region: ${{ env.AWS_REGION }}
          security-group-name: ${{ env.SECURITY_GROUP_NAME }}
          host: ${{ secrets.DEPLOY_HOST }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          env-file: ${{ secrets.PROD_ENV_FILE }}
          image: ${{ steps.target.outputs.image }}

      # deploy.sh 의 종료 코드가 그대로 메시지가 된다.
      # 분기 로직을 워크플로에 다시 쓰지 않는다.
      - name: 6. Discord 통보
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RC: ${{ steps.deploy.outputs.rc }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -n "${DISCORD_WEBHOOK_URL:-}" ] || { echo "웹훅 없음 — 알림 생략"; exit 0; }

          short="${SHA:0:7}"
          case "$RC" in
            0) title="배포 성공"        ; desc="${short} 반영 완료"                                   ; color=5763719  ;;
            2) title="배포 실패 — 롤백됨"; desc="${short} 배포가 실패해 직전 이미지로 되돌렸다. 서비스는 정상." ; color=16705372 ;;
            1) title="배포 실패"        ; desc="${short} 실패. 롤백 대상이 없다(최초 배포). 수동 확인 필요." ; color=15548997 ;;
            3) title="배포 실패 + 롤백 실패"; desc="서비스가 정상이 아니다. 즉시 확인 필요. 시도: ${short}"  ; color=10038562 ;;
            75) echo "다른 배포가 진행 중이었다 — 알림 생략"; exit 0 ;;
            # deploy.sh 에 도달조차 못한 경우다 — 보안그룹 개방이나 SSH 접속에서 죽었다.
            '') title="배포 실패 — 서버에 도달 못함"; desc="보안그룹 개방 또는 SSH 접속 단계에서 실패했다. 시도: ${short}" ; color=10038562 ;;
            *) title="배포 결과 불명"   ; desc="종료 코드 ${RC}. 로그를 확인할 것."                    ; color=10038562 ;;
          esac

          # 응답 코드를 본다. curl 은 -f 없이는 HTTP 4xx 에도 0 을 돌려주므로,
          # 웹훅이 폐기됐어도 이 단계가 초록불로 지나간다. 실제로 그랬다 —
          # 웹훅을 재발급한 뒤 시크릿을 갱신하지 않아 배포 알림이 조용히
          # 사라졌고, 로그를 펼쳐보기 전까지 아무도 몰랐다.
          #
          # job 을 실패시키지는 않는다. 배포는 성공했는데 알림 때문에 빨간불이
          # 뜨면, 그것이야말로 사람이 무시하기 시작하는 신호가 된다.
          code="$(jq -n --arg t "$title" --arg d "$desc
          $RUN_URL" --argjson c "$color" \
            '{embeds:[{title:$t,description:$d,color:$c}]}' \
            | curl -sS -o /dev/null -w '%{http_code}' -X POST "$DISCORD_WEBHOOK_URL" \
                -H "Content-Type: application/json" -d @-)"

          case "$code" in
            2*) echo "Discord 통보 완료 (HTTP ${code})" ;;
            *) echo "::warning::Discord 통보 실패 (HTTP ${code}) — 웹훅이 폐기됐거나 DISCORD_WEBHOOK_URL 시크릿이 옛 값이다" ;;
          esac

      # continue-on-error 로 넘어온 실패를 여기서 job 실패로 되돌린다.
      # 75(다른 배포 진행 중)는 실패가 아니다 — 줄 서서 기다렸을 뿐이다.
      - name: 7. 결과 판정
        if: always()
        env:
          RC: ${{ steps.deploy.outputs.rc }}
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          set -uo pipefail
          if [ "$OUTCOME" != "success" ] && [ -z "${RC:-}" ]; then
            echo "::error::deploy.sh 에 도달하지 못했다 (접속 또는 보안그룹 단계 실패)"
            exit 1
          fi
          case "$RC" in
            0 | 75) exit 0 ;;
            *)
              echo "::error::deploy.sh 종료 코드 ${RC}"
              exit 1
              ;;
          esac
