# CI — docs/13-dev-workflow.md §3
# build / flyway-validate / flyway-version-check 3잡이 required check (머지 차단)
# + frontend 잡은 문서 밖 추가분 (타입·빌드 깨짐 방지 — 팀 합의로 required 여부 결정)
name: CI

on:
  pull_request:
    branches: [develop, 'release/**', main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 컴파일 + 테스트(스키마 검증 포함) + SpotBugs — 잡 이름은 required check로 참조되므로 짧게 유지
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: twojo
          POSTGRES_PASSWORD: twojo
          POSTGRES_DB: twojo_test
        ports:
          - 5433:5432   # application-test.yml과 동일 좌표
        options: >-
          --health-cmd "pg_isready -U twojo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build & Test
        # 컴파일 + 테스트(스키마 검증 포함 — 서비스 컨테이너 PG) + 정적 분석(spotbugs)
        run: ./gradlew build

  flyway-validate:
    # 실제 PG에 마이그레이션 적용·검증
    name: flyway-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: twojo
          POSTGRES_PASSWORD: twojo
          POSTGRES_DB: twojo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U twojo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Flyway Migrate + Validate
        run: ./gradlew flywayMigrate flywayValidate
        env:
          FLYWAY_URL: jdbc:postgresql://localhost:5433/twojo
          FLYWAY_USER: twojo
          FLYWAY_PASSWORD: twojo

  flyway-version-check:
    # 마이그레이션 버전 번호 중복 검사
    name: flyway-version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 중복 버전 검사
        run: |
          cd backend/src/main/resources/db/migration
          dup=$(ls V*.sql 2>/dev/null | sed -E 's/^(V[0-9]+)__.*/\1/' | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "::error::중복된 Flyway 버전이 있습니다: $dup"
            echo "도메인 번호대를 확인하세요 — A=1xx · B=2xx · C=3xx · D=4xx (docs/13-dev-workflow.md §0.2)"
            exit 1
          fi
          echo "버전 중복 없음"

  frontend:
    # 타입 검사 + 빌드 — 13-dev-workflow.md 3잡 외 추가분 (required 여부는 팀 결정)
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
